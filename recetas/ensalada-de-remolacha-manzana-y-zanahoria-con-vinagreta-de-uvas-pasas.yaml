titulo: Ensalada de remolacha, manzana y zanahoria con vinagreta de uvas pasas
tags: [remolacha, zanahoria, manzana, uvas-pasas, ensalada, guarnicion, vegetariana, vegana, otono]
raciones: 2
kcal_racion: 140
proteina_racion_g: 2
aceite_cucharillas: 1
momento: [guarnicion]
sodio: medio
ingredientes:
  - texto: ½ remolacha grande
  - texto: ½ zanahoria grande
  - texto: 1 manzana roja
  - texto: 20 g de uvas pasas sin semilla
  - texto: 35 ml de vinagre de manzana
  - texto: ¼ cucharadita de sal fina
  - texto: 25 ml de agua
  - texto: ½ chalota pequeña (o cebollino al gusto)
  - texto: 1 cucharilla de aceite de oliva virgen extra
pasos:
  - Poner en una sartén pequeña las pasas, el vinagre, el agua y la sal, y cocinar a fuego medio unos 5 minutos, removiendo de vez en cuando, hasta que el líquido se reduzca a un tercio (se omite el azúcar de la receta original: el vinagre y las pasas ya aportan suficiente dulzor).
  - Mientras se cocina, cortar la chalota en juliana fina y ponerla en un cuenco.
  - Verter encima la mezcla caliente de pasas, mezclar y dejar reposar mientras se prepara el resto de la ensalada.
  - Lavar y pelar la remolacha, la zanahoria y la manzana. Rallar finas la remolacha y la zanahoria, y gruesa la manzana.
  - Mezclar en un bol la remolacha, la zanahoria y la manzana ralladas.
  - Añadir el aceite a la mezcla de pasas y chalota y remover bien.
  - Verter la vinagreta sobre la ensalada y mezclar todo junto.
fuente: https://elpais.com/gastronomia/el-comidista/2024-10-14/el-otono-en-una-ensalada-remolacha-manzana-y-zanahoria-con-vinagreta-de-uvas-pasas.html
