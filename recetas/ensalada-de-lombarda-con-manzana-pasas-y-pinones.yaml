titulo: Ensalada de lombarda con manzana, pasas y piñones
tags: [lombarda, col, manzana, pasas, pinones, verdura, ensalada, guarnicion, vegetariana, vegana, sin-gluten, sin-coccion]
raciones: 2
kcal_racion: 160
proteina_racion_g: 3
aceite_cucharillas: 1
momento: [guarnicion, comida, cena]
sodio: bajo
ingredientes:
  - texto: unos 170 g de lombarda (⅙ de una lombarda mediana)
  - texto: 1 manzana (Granny Smith, reineta o Gala)
  - texto: 20 g de pasas (sultanas o moscatel)
  - texto: 10 g de piñones
  - texto: 1 cucharada de vinagre de manzana o de Jerez
    ingrediente: vinagre
  - texto: un trozo de cebolla blanca dulce (unos 40 g, opcional)
  - texto: 1 cucharilla de aceite de oliva virgen extra
    ingrediente: aceite-oliva
  - texto: una pizca de sal
  - texto: pimienta recién molida
pasos:
  - Retirar las hojas exteriores estropeadas de la lombarda, partirla por la mitad, sacarle el tronco y cortarla en juliana muy fina con cuchillo o mandolina (con cuidado de los dedos).
  - Pasar la lombarda a un bol grande, añadir una pizca de sal y un chorrito de vinagre y masajearla con las manos un par de minutos.
  - Añadir las pasas y dejar reposar 15 minutos, hasta que la col se ablande y las pasas se hidraten.
  - Tostar los piñones en una sartén pequeña, sin aceite y a fuego medio, removiéndolos a menudo hasta que se doren. Retirarlos y dejar que se enfríen.
  - Pelar la manzana (si se quiere), quitarle el corazón y cortarla en láminas finas o en dados pequeños.
  - Si se usa la cebolla, cortarla en pluma fina o en daditos.
  - Echar al bol la manzana, la cebolla, la mayor parte de los piñones, otra pizca de sal, pimienta y la cucharilla de aceite.
  - Probar y corregir de sal y de acidez. Dejar reposar al menos 10 minutos más para que se mezclen los sabores, y servir con los piñones reservados por encima.
fuente: https://elpais.com/gastronomia/el-comidista/2026-02-23/ensalada-de-lombarda-una-version-fresca-de-la-receta-navidena.html
