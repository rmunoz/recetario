titulo: Tortilla de brócoli y queso
tags: [tortilla, brocoli, huevo, queso, cebolla, verdura, vegetariana, sin-gluten, sarten, alta-en-proteina]
raciones: 2
kcal_racion: 345
proteina_racion_g: 25
aceite_cucharillas: 1
momento: [comida, cena]
sodio: medio
ingredientes:
  - texto: 350 g de brócoli fresco o congelado
  - texto: 1 cebolla
  - texto: 4 huevos medianos
  - texto: 1 cucharadita de mostaza (opcional, da sabor)
  - texto: 50 g de queso rallado (emmental, gouda o cheddar)
  - texto: 1 cucharilla de aceite de oliva
    ingrediente: aceite-oliva
  - texto: sal fina
  - texto: pimienta negra
pasos:
  - Si el brócoli es fresco, separarlo en ramilletes. Cocerlo en agua hirviendo con sal hasta que esté tierno y dejarlo escurrir en un colador.
  - Cortar la cebolla en juliana fina. En una sartén antiadherente a fuego medio-bajo, rehogarla con una pizca de sal y un chorrito de agua, tapada, hasta que se ablande. Destapar, añadir media cucharilla de aceite y dorarla hasta que quede translúcida.
  - Batir los huevos en un bol y salpimentar.
  - Cuando el brócoli se haya templado, exprimirlo con las manos limpias para sacarle todo el agua que se pueda. Picarlo un poco y echarlo al bol.
  - Añadir la cebolla, el queso rallado y la mostaza, y mezclar bien.
  - Calentar la sartén antiadherente con la otra media cucharilla de aceite a fuego suave, verter la mezcla y cuajarla por los dos lados, dándole la vuelta con un plato como en una tortilla de patatas, hasta que esté hecha. Servir.
fuente: https://elpais.com/gastronomia/el-comidista/2026-03-12/tortilla-de-brocoli-y-queso.html
