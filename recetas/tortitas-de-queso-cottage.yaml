titulo: Tortitas de queso cottage
tags: [queso-cottage, huevo, avena, merienda, dulce, sarten, alta-proteina]
raciones: 2
kcal_racion: 250
proteina_racion_g: 20
aceite_cucharillas: 0.5
momento: [merienda]
sodio: medio
ingredientes:
  - texto: 150 g de queso cottage 0% o bajo en grasa (en vez de queso cottage normal, para mantener la proteína sin la grasa de más)
  - texto: 2 huevos
  - texto: 50 g de harina de avena
  - texto: ½ cucharadita de levadura en polvo
  - texto: ½ cucharadita de esencia de vainilla y ½ cucharadita de canela en polvo (opcional)
  - texto: ½ cucharilla de aceite de oliva (para la sartén)
  - texto: fruta fresca para acompañar (opcional)
pasos:
  - Batir el queso cottage con los huevos hasta que quede una mezcla homogénea; si se quiere una masa más fina y sin grumos, usar una batidora.
  - Añadir la harina de avena y la levadura (y la vainilla y la canela, si se usan) y mezclar bien hasta integrar todo.
  - Calentar una sartén antiadherente con la media cucharilla de aceite, extendiéndolo bien con un papel para que quede una capa fina.
  - Verter pequeñas porciones de masa en la sartén y cocinar a fuego medio-bajo unos 2-3 minutos por cada lado, dándoles la vuelta cuando los bordes hayan cuajado y salgan pequeñas burbujas en la superficie.
  - Servir recién hechas, acompañadas de fruta fresca si se quiere (mejor evitar frutos secos y miel, para no sumarle kcal de más a un plato que ya es un capricho).
fuente: https://www.hola.com/cocina/noticias/20261106933015/como-hacer-tortitas-de-queso-cottage/
