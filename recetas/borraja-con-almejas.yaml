titulo: Borraja con almejas
tags: [borraja, almejas, marisco, verdura, plato-principal, bajo-en-kcal, sin-gluten]
raciones: 2
kcal_racion: 245
proteina_racion_g: 17
aceite_cucharillas: 2
momento: [comida, cena]
sodio: alto
ingredientes:
  - texto: 800 g de borraja limpia
  - texto: 400 g de almejas
  - texto: 1 diente de ajo
  - texto: 2 cucharillas de aceite
  - texto: 1 cucharilla de maizena
  - texto: 100 ml de vino blanco
  - texto: 200 ml de agua
  - texto: 1 huevo duro
  - texto: sal y pimienta
pasos:
  - Cocer la borraja cortada en trozos de unos 5 cm (15 minutos aproximadamente, o al gusto).
  - En una sartén, sofreír el ajo laminado o en trozos pequeños con las 2 cucharillas de aceite a fuego medio-bajo. Cuando empiece a tomar calor, añadir la cucharilla de maizena y mezclar bien; a continuación, añadir el vino blanco y seguir removiendo.
  - Cuando el alcohol del vino se haya evaporado, añadir el agua y seguir removiendo para que se vaya formando una salsa ligera. Añadir las almejas y seguir cocinando hasta que se abran todas (si alguna no se abre, retirarla).
  - Añadir la borraja cocida a la sartén, salpimentar y mezclar bien.
  - Repartir en los dos platos, cortar el huevo duro en trocitos de un par de centímetros y repartirlo por encima.
