titulo: Col asada con puré de manzana y salsa de mostaza
tags: [col, manzana, verdura, horno, guarnicion, mostaza, vegetariana, sin-gluten, baja-en-kcal]
raciones: 2
kcal_racion: 278
proteina_racion_g: 9
aceite_cucharillas: 1.5
momento: [guarnicion, cena]
sodio: medio
ingredientes:
  - grupo: Puré de manzana
    items:
      - texto: "1½ manzanas Granny Smith (unos 225 g)"
      - texto: "2 manzanas Royal Gala (unos 300 g)"
      - texto: "½ diente de ajo"
      - texto: "¼ de cucharadita de semillas de eneldo (opcional)"
      - texto: "¼ de cucharadita de mostaza en grano (opcional)"
      - texto: "¼ de cucharadita de canela en polvo"
      - texto: pimienta blanca molida o en grano
      - texto: sal
      - texto: 75 ml de agua
      - texto: el zumo de ¼ de limón
  - grupo: Col asada
    items:
      - texto: "½ col blanca mediana (unos 600 g)"
      - texto: sal
      - texto: pimienta negra recién molida
      - texto: 1 cucharilla de aceite de oliva (para pincelar la col)
  - grupo: Salsa de mostaza
    items:
      - texto: "½ chalota"
      - texto: "½ cucharada de mostaza de Dijon"
      - texto: 75 g de yogur griego 0 % o queso batido 0 % (sustituye a la nata para cocinar)
      - texto: "½ cucharilla de aceite de oliva (para sofreír la chalota)"
      - texto: sal
pasos:
  - Pelar las manzanas y cortarlas en dados. Ponerlas en una olla con el agua, el ajo pelado, las especias y la sal; cocer 35-40 minutos desde que arranque el hervor, hasta que estén muy blandas. Apartar del fuego, añadir el zumo de limón y triturar con la turmix. Reservar.
  - Precalentar el horno a 200°C. Cortar la col en cuartos o en rodajas de dos centímetros, colocarlas en una bandeja, pincelarlas con la cucharilla de aceite y salpimentar por las dos caras. Asar 20 minutos, dándoles la vuelta a mitad de cocción, hasta que estén doradas y tiernas.
  - Sofreír la chalota picada en una sartén con la media cucharilla de aceite hasta que se ablande y dore un poco. Añadir la mostaza de Dijon, retirar del fuego y mezclar con el yogur griego 0 % o el queso batido 0 % fuera del calor directo para que no se corte. Salar al gusto.
  - Montar el plato con el puré de manzana de base, la col encima y la salsa de mostaza y yogur por encima.
fuente: https://elpais.com/gastronomia/el-comidista/2023-11-23/col-asada-con-pure-de-manzana-y-salsa-de-mostaza.html
