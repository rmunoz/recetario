titulo: Lentejas vegetarianas
tags: [lentejas, legumbre, verdura, plato-principal, vegetariana, sin-gluten, olla-a-presion, bajo-en-kcal]
raciones: 2
kcal_racion: 275
proteina_racion_g: 19
aceite_cucharillas: 0
momento: [comida, cena]
sodio: medio
ingredientes:
  - texto: 150 g de lentejas pardinas (de las rápidas, sin remojo)
  - texto: ½ zanahoria
  - texto: ½ cebolla
  - texto: ¼ de pimiento rojo
  - texto: ½ diente de ajo
  - texto: 1 hoja de laurel
  - texto: ½ tomate pequeño
  - texto: ½ cucharilla de pimentón dulce
  - texto: ½ cucharilla de pimiento choricero
  - texto: sal
pasos:
  - Limpiar la zanahoria, la cebolla y el pimiento, cortarlos en trozos grandes y meterlos en una malla o bolsa apta para olla a presión.
  - Poner la malla con las verduras en la olla junto con las lentejas y la hoja de laurel, y cubrir con agua hasta que quede todo tapado.
  - Añadir el pimentón, el pimiento choricero y la sal.
  - Cerrar la olla y subir el fuego al máximo hasta que alcance presión; en ese momento bajar el fuego y cocinar 8 minutos. Apagar el fuego, dejar que la presión baje sola durante 10 minutos y luego abrir la válvula para liberar el resto antes de abrir la olla.
  - Sacar la malla de verduras, pasarlas al vaso de la batidora con un poco del agua de cocción y unas lentejas, y batir hasta conseguir un puré fino.
  - Mezclar el puré con el resto de las lentejas. Saben mejor si reposan 24 horas en la nevera antes de comer.
fuente: propia
