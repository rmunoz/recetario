titulo: Pita rellena de verduras y queso fundido
tags: [pita, queso, calabacin, pimientos-asados, vegetariana, sarten, comida]
raciones: 2
kcal_racion: 385
proteina_racion_g: 26
aceite_cucharillas: 1
momento: [comida, cena]
sodio: alto
ingredientes:
  - texto: 2 panes de pita
  - texto: 1 calabacín pequeño (unos 200 g)
  - texto: 150 g de pimientos asados (en conserva)
  - texto: 150 g de queso light que funda bien (tipo mozzarella light)
  - texto: 1 cucharilla de aceite de oliva
  - texto: Sal
  - texto: Pimienta
pasos:
  - Cortar el calabacín en rodajas de medio centímetro y saltearlas en una sartén con la cucharilla de aceite a fuego medio hasta que se doren por los dos lados. Salpimentar y apartar.
  - Cortar el queso light en láminas finas.
  - Abrir cada pan de pita por la mitad sin llegar hasta el borde, para que quede como un bolsillo donde meter el relleno.
  - Repartir el queso, el calabacín y los pimientos asados dentro de cada pita.
  - Tostar las pitas rellenas en la misma sartén antiadherente, sin añadir más aceite, a fuego medio por ambos lados, hasta que el queso funda y el pan quede dorado. Servir caliente.
fuente: https://elpais.com/gastronomia/el-comidista/2026-07-17/pita-rellena-de-verduras-y-queso-fundido.html
