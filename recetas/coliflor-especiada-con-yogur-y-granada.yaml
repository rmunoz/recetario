titulo: Coliflor especiada con yogur y granada
tags: [coliflor, verdura, guarnicion, vegetariana, sin-gluten, airfryer, horno, yogur, granada, especias, baja-en-kcal]
raciones: 2
kcal_racion: 115
proteina_racion_g: 9
aceite_cucharillas: 0.5
ingredientes:
  - texto: "½ coliflor mediana (unos 500 g)"
  - texto: especias al gusto (mezcla cajún)
  - texto: "¼ de diente de ajo (opcional)"
  - texto: "½ limón (1 si es pequeño)"
  - texto: "½ cucharilla de aceite de oliva"
  - texto: 1 yogur griego 0 % (alto en proteína)
  - texto: 1 cucharadita de semillas de sésamo
  - texto: 2 cucharadas de semillas de granada
  - texto: perejil fresco
  - texto: sal
  - texto: pimienta
pasos:
  - Precalentar la airfryer a 180°C (vale también el horno con calor arriba y abajo).
  - Preparar la salsa rallando la piel del limón y mezclándola con dos cucharadas de su zumo, el yogur, las semillas de sésamo, sal, pimienta y el ajo picado si se usa. Mezclar bien hasta que el sésamo quede integrado y meter en la nevera.
  - Separar la coliflor en floretes, quitar la parte más dura del tallo y cortarlo en rodajas. Secarla bien y aliñarla con la media cucharilla de aceite, dos cucharadas más de zumo de limón, sal y las especias.
  - Masajear la coliflor con el aliño para que quede bien repartido. Cocinarla en la airfryer (o en el horno, extendida en una bandeja) entre 30 y 40 minutos, dándole la vuelta un par de veces, hasta que quede dorada por fuera y aún algo firme por dentro.
  - Servir en los platos con la salsa de yogur por encima, la granada y el perejil picado, y un poco más de sal si hace falta.
fuente: https://elpais.com/gastronomia/el-comidista/2023-10-11/coliflor-especiada-con-yogur-y-granada.html
