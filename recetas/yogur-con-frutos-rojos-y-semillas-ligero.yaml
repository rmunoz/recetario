titulo: Yogur con frutos rojos y semillas (versión ligera)
variante_de: yogur-con-frutos-rojos-y-semillas
variante_resumen: Versión más ligera, sin higo y con 1 cucharilla de semillas
tags: [desayuno, yogur, frutos-rojos, semillas, sin-coccion, rapido, alta-en-proteina, ligera, propia]
raciones: 1
kcal_racion: 90
proteina_racion_g: 7
aceite_cucharillas: 0
momento: [desayuno]
sodio: bajo
ingredientes:
  - texto: 2 moras
  - texto: 4 arándanos
  - texto: 6 grosellas
  - texto: 2 frambuesas
  - texto: 1 cucharilla de mezcla de semillas (chía, calabaza, girasol, sésamo y lino) # ~5 g
  - texto: 1 yogur Activia 0 % MG, 0 % azúcares añadidos
    ingrediente: yogur-activia-0
pasos:
  - Echar los frutos rojos y las semillas en un bol y desmenuzar con una cucharilla, dejando trozos de diferentes tamaños.
  - Menear el yogur unos segundos antes de abrirlo para que quede cremoso, y echarlo en el bol.
  - Mezclar todo bien.
fuente: propia
