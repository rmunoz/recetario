titulo: Tofu glaseado
tags: [tofu, soja, asiatica, vegetariana, sarten, comida]
raciones: 2
kcal_racion: 640
proteina_racion_g: 28
aceite_cucharillas: 2
momento: [comida]
sodio: alto
ingredientes:
  - texto: 450 g de tofu firme
  - texto: 90 ml de salsa de soja (mejor baja en sodio si se encuentra)
  - texto: 1 cucharilla de aceite de sésamo
  - texto: 90 ml de mirin (o 85 ml de vino blanco + 10 g de azúcar)
  - texto: 50 ml de agua
  - texto: 15 g de azúcar
  - texto: 10 g de copos de chile seco
  - texto: 1 cebolleta china (o 2 ajos tiernos)
  - texto: 1 cucharilla de aceite de girasol
  - texto: 1 diente de ajo
  - texto: 5 g de jengibre fresco
  - texto: 200 g de verdura para escaldar (por ejemplo bok choy)
  - texto: 120 g de arroz blanco en crudo
  - texto: 1 cucharadita de semillas de sésamo tostado, para servir
    ingrediente: semillas-sesamo-tostado
pasos:
  - Escurrir bien el tofu, envolverlo en papel de cocina o un trapo limpio y poner algo de peso encima; dejarlo así 10 minutos para que suelte el agua.
  - Mientras, mezclar en un bol la salsa de soja, la cucharilla de aceite de sésamo, el mirin, el agua, el azúcar y los copos de chile. Picar el ajo, el jengibre y la cebolleta china.
  - Cortar el tofu por la mitad en horizontal y luego cada mitad en seis trozos, para tener doce dados.
  - Calentar la cucharilla de aceite de girasol en una sartén antiadherente a fuego medio-alto y dorar el tofu unos 5 minutos por cada lado, hasta que quede crujiente. Retirarlo y reservar.
  - En la misma sartén, sofreír el ajo, el jengibre y la parte blanca de la cebolleta 15 segundos, hasta que huela bien. Añadir la mezcla de salsas, devolver el tofu a la sartén y dejar reducir a fuego medio-alto unos 5 minutos, repartiendo la salsa por encima del tofu de vez en cuando y dándole la vuelta.
  - Al mismo tiempo, escaldar la verdura elegida en agua hirviendo (con el bok choy basta un minuto) y pasarla por agua fría para cortar la cocción.
  - Servir el tofu sobre una cama de arroz blanco, con la verdura escaldada al lado, y terminar con la salsa que haya quedado en la sartén, la parte verde de la cebolleta y las semillas de sésamo tostado.
fuente: https://elpais.com/gastronomia/recetas/2023-07-27/tofu-glaseado.html
