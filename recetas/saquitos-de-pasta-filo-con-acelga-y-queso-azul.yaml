titulo: Saquitos de pasta filo con acelga y queso azul
tags: [pasta-filo, acelga, queso-azul, horno, vegetariana, plato-principal]
raciones: 2
kcal_racion: 430
proteina_racion_g: 15
aceite_cucharillas: 1.5
momento: [comida, cena]
sodio: alto
ingredientes:
  - texto: 8-10 láminas de pasta filo (~150 g en total, para 2-3 capas por saquito)
  - texto: 1 manojo de acelgas (500 g aprox.), solo las hojas
  - texto: 60 g de queso azul (el mínimo del rango de la receta original, para no disparar la grasa)
  - texto: 1 diente de ajo
  - texto: 1 puñado pequeño de uvas pasas (opcional)
  - texto: 1½ cucharillas de aceite de oliva (para el ajo y para pincelar el filo)
  - texto: sal
  - texto: pimienta negra
pasos:
  - Encender el horno a 200°C (la pasta filo se dora más rápido que el hojaldre, por eso bajamos un poco la temperatura).
  - Lavar bien las acelgas, quitarles las pencas (se pueden guardar para otro plato) y cortar las hojas en trozos.
  - Laminar el ajo y dorarlo ligeramente en una sartén antiadherente con media cucharilla de aceite, a fuego medio-bajo.
  - Añadir las acelgas, salpimentar y rehogar unos minutos hasta que estén tiernas. Pasar a un bol y dejar enfriar.
  - Escurrir bien el agua de las acelgas apretándolas con las manos y mezclarlas con el queso azul desmigado y las pasas, si se usan.
  - Extender una lámina de pasta filo sobre la superficie de trabajo, pincelarla con un poco de aceite y superponer otra lámina encima (una tercera si son muy finas), hasta tener 4 pilas de 2-3 capas. Tapar con un paño húmedo las láminas que no se estén usando para que no se sequen y se rompan.
  - Cortar cada pila en un cuadrado y repartir el relleno en el centro.
  - Llevar las cuatro esquinas de cada cuadrado hacia el centro, apretando para cerrar el saquito, y pincelar por fuera con el aceite que quede para que doren bien.
  - Hornear 15-18 minutos, hasta que queden dorados y crujientes.
fuente: https://elpais.com/gastronomia/recetas/2022/06/01/receta/1654093054_618235.html
