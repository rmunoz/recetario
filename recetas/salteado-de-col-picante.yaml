titulo: Salteado de col picante
tags: [col, repollo, verdura, guarnicion, vegana, vegetariana, sin-gluten, picante, especias, salteado, sarten, baja-en-kcal]
raciones: 2
kcal_racion: 100
proteina_racion_g: 3
aceite_cucharillas: 1
momento: [guarnicion, comida, cena]
sodio: bajo
ingredientes:
  - texto: 250 g de repollo
  - texto: ½ cebolla
  - texto: 2 dientes de ajo
  - texto: 1 cayena seca
  - texto: 1 hoja de laurel seca (en lugar de las hojas de curry)
  - texto: ½ cucharadita de semillas de mostaza
  - texto: ½ cucharadita de comino en grano
  - texto: ½ cucharadita de cúrcuma molida
  - texto: 1 cucharada de coco rallado seco
  - texto: 1 cucharilla de aceite de oliva
    ingrediente: aceite-oliva
  - texto: ¼ de lima
  - texto: sal al gusto
pasos:
  - Pelar los ajos y cortarlos en láminas. Pelar la cebolla y cortarla en juliana.
  - Cortar el repollo en tiras finas, quitando las nervaduras más gruesas.
  - Calentar el aceite en una sartén amplia y sofreír la mostaza y el comino hasta que las semillas de mostaza empiecen a saltar.
  - Añadir la cebolla y sofreírla hasta que empiece a ablandarse (no hace falta que llegue a transparentarse). Incorporar la cayena desmenuzada con los dedos y la hoja de laurel.
  - Echar los ajos laminados y darles unas vueltas sin dejar que se tuesten.
  - Añadir el repollo, la cúrcuma y algo de sal, y mezclar bien. Con poco aceite, añadir un chorrito de agua, tapar y cocinar a fuego bajo en su propio jugo hasta que esté tierno. Si se prefiere más tostado, saltearlo a fuego más vivo, sin tapar, hasta que se ablande y empiece a dorarse.
  - Cuando esté al punto, añadir el coco hidratado antes en un poco de agua caliente.
  - Probar, corregir de sal si hace falta y servir con el zumo de la lima por encima.
