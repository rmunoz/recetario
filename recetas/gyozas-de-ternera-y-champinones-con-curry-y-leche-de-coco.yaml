titulo: Gyozas de ternera y champiñones con curry y leche de coco
variante_de: gyozas-de-verduras-con-curry-y-leche-de-coco
variante_resumen: Relleno de ternera picada y champiñones, con más proteína
tags: [gyozas, ternera, carne-picada, champinones, setas, curry, leche-de-coco, asiatica, plato-principal, alta-en-proteina]
raciones: 2
kcal_racion: 430
proteina_racion_g: 23
aceite_cucharillas: 1
momento: [comida, cena]
sodio: medio
ingredientes:
  - texto: 20 obleas de gyoza congeladas (160 g)
    ingrediente: obleas-gyoza
  - grupo: Relleno
    items:
      - texto: 120 g de carne picada de ternera magra
      - texto: 100 g de champiñones
      - texto: 1 cebolleta
      - texto: 1 diente de ajo
      - texto: ½ cucharadita de jengibre fresco rallado
      - texto: 1 cucharadita de salsa de soja
        ingrediente: salsa-soja
      - texto: pimienta negra
  - grupo: Salsa
    items:
      - texto: 200 ml de leche de coco light
      - texto: 150 ml de agua
      - texto: 1 cucharada de curry en polvo
      - texto: 1 cucharada de salsa de soja
        ingrediente: salsa-soja
  - grupo: Aceite aromático
    items:
      - texto: 1 cucharilla de aceite de oliva suave (o de girasol)
        ingrediente: aceite-oliva
      - texto: 1 cucharilla de semillas de sésamo
        ingrediente: semillas-sesamo-tostado
      - texto: 1 diente de ajo
      - texto: 1 manojito de cebollino (unos 10 g)
      - texto: 3 tallos de cilantro
pasos:
  - Sacar las obleas del congelador y descongelarlas como indique el paquete (suele bastar un rato a temperatura ambiente). Mantenerlas tapadas con un paño húmedo para que no se resequen.
  - Limpiar los champiñones y picarlos muy finos, igual que la cebolleta y el ajo. Si sueltan mucho agua, escurrirlos un poco apretándolos con la mano.
  - Mezclar en un bol la ternera, los champiñones, la cebolleta, el ajo, el jengibre, la cucharadita de soja y un poco de pimienta. Amasar con la mano un par de minutos hasta que la mezcla ligue bien. El relleno va crudo.
  - Montar las gyozas. Poner una oblea en la palma, colocar una cucharadita colmada de relleno en el centro, mojar el borde con un dedo húmedo, doblarla por la mitad y apretar los bordes para sellarla (se pueden plisar). Dejarlas en un plato sin que se toquen. Salen unas 20.
  - Calentar en una sartén ancha la leche de coco light con el agua. Añadir el curry y la cucharada de soja y mezclar bien.
  - Meter las gyozas en la salsa y dejarlas hervir suavemente, a fuego bajo, unos 6-7 minutos, hasta que la carne esté completamente hecha por dentro.
  - Mientras, picar muy finos el ajo, el cilantro y el cebollino y ponerlos en un bol pequeño con el sésamo. Calentar la cucharilla de aceite hasta que esté bien caliente y verterla encima.
  - Servir las gyozas con su salsa y un poco del aceite aromático por encima, con más cilantro fresco.
fuente: https://elpais.com/gastronomia/el-comidista/2025-10-08/gyozas-con-curry-y-leche-de-coco.html
