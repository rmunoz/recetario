resumen_semanal: >
  Primera semana del histórico, así que las cuatro recetas del repositorio
  cuentan como nuevas. Pescado azul 3 veces (anchoa, salmón, atún), cefalópodo
  1 vez (sepia), legumbres solo 1 vez (lentejas, algo justo frente al
  orientativo de 2-3), carne roja 1 vez (hamburguesa), ave 1 vez (pavo) y huevo
  en 2 días. Buena variedad de técnicas y sin platos repetidos. El aceite se
  queda siempre muy por debajo del límite de 4 cucharillas/día. Los días
  normales rondan 1480-1540 kcal, algo por debajo del objetivo de 1700-1800
  pese al pan y los acompañamientos de patata/arroz añadidos; lunes y domingo
  son días de ayuno (cena temprana, sin merienda) y se quedan bajos a
  propósito.
lista_compra:
  - 2 cebollas
  - 4-5 tomates frescos (hamburguesa, ensalada, tostada y lentejas)
  - 1 lata de tomate entero pelado
  - 600 g de patatas (para cocer y para horno)
  - 120 g de arroz basmati
  - 80 g de arroz normal (para las lentejas)
  - 70 g de pasta de sopa (fideos)
  - 160 g de pasta tipo macarrones (sábado)
  - pan del día (unos 100 g/persona repartidos entre comida y cena) y unas
    rebanadas de pan de molde para las tostadas
  - 300 g de jamón cocido
  - 200 g de queso tierno
  - 80 g de queso fresco
  - 2 naranjas
  - 2 latas de pescado azul en conserva (caballa, sardinas o atún, al gusto)
  - 6 huevos
  - 2 latas pequeñas de atún en conserva
  - 1 lata pequeña de anchoas en conserva
  - 1 bote de pepinillos
  - 1 pimiento rojo
  - 300-350 g de filete de pavo
  - 60 g de jamón serrano
  - 30 g de queso parmesano
  - 300 g de carne picada (hamburguesas)
  - mostaza a la antigua
  - 1 lechuga
  - 300 g de sepia
  - 300 g de salmón
  - 350 g de col (ensalada simple de col, receta doblada para 2)
  - 4 piezas de fruta de temporada (meriendas)
  - 1 yogur griego 0 %
  - semillas de granada (o 1 granada)
  - ½ coliflor mediana (unos 500 g)
  - 1 bote de judías verdes troceadas en conserva (360 g escurridas)
