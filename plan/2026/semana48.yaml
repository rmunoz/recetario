resumen_semanal: >
  Semana con dos raciones de pescado (salmón a la naranja y lubina a la plancha),
  dos de legumbre (lentejas vegetarianas y garbanzos con arroz) y una de carne roja
  (ternera); no entra pollo ni pavo, buen candidato a añadir la próxima semana. El
  huevo aparece en varios platos (huevos duros, ensalada ilustrada) y la verdura
  está presente en todas las comidas principales. La ensalada simple de col se usa
  varias veces como guarnición ligera, pero el plato principal nunca se repite en
  días consecutivos.
lista_compra:
  - 1,75 kg de col (2 coles pequeñas o 1 grande)
  - 8 alcachofas
  - 2 cebollas
  - 1 calabacín pequeño
  - 1 remolacha grande
  - 2 zanahorias
  - 2 manzanas rojas
  - 1 pimiento rojo
  - 6-7 tomates pequeños/medianos, más 200 g extra para la ensalada ilustrada
  - 1 lata de tomate entero pelado (400 g)
  - 1 manojo de acelgas (500 g)
  - 300 g de setas variadas
  - 1 bolsa de lechugas variadas
  - 1 cebolleta
  - 4 pepinillos en vinagre
  - 2 pimientos de piquillo
  - 2-3 dientes de ajo
  - 1 chalota
  - 300 g de patata
  - 1,5 kg de fruta de temporada (para toda la semana)
  - 40 g de uvas pasas sin semilla
  - granada (un puñado)
  - 1 limón
  - 1 naranja
  - 200 g de lomo de salmón (2 filetes)
  - 300 g de lubina (2 filetes)
  - 45 g de jamón serrano en tiras
  - 200 g de jamón cocido
  - 2 latas pequeñas de pescado azul en conserva (atún, sardinas o caballa, ~160 g)
  - 6 anchoas del Cantábrico en aceite
  - 300 g de pechuga de pollo
  - 300 g de ternera (filetes)
  - 1 docena de huevos
  - 200 g de queso tierno
  - 150 g de queso light que funda
  - 60 g de queso azul
  - 150 g de queso cottage 0 %
  - 1 yogur griego 0 %
  - 7 yogures Activia 0 %
  - leche de soja (la habitual para los cafés)
  - 150 g de lentejas pardinas
  - 1 bote de garbanzos cocidos (400 g)
  - 150 g de arroz
  - 1 bote de judías verdes troceadas en conserva (360 g escurridas)
  - 150 g de pasta filo
  - 2 panes de pita
  - 70 g de pasta de sopa
  - 220 g de pan normal
  - 50 g de harina de avena
  - 140 g de maíz dulce (lata pequeña)
  - 150 g de pimientos asados en conserva
  - 70 g de mezcla de semillas (chía, calabaza, girasol, sésamo, lino)
  - 140 g de nueces
  - salsa de soja (un poco, para el salmón)
