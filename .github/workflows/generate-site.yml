name: Generate site

on:
  push:
    branches: [main]
    paths:
      - "recetas/**"
      - "ingredientes/**"
      - "scripts/**"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate site
        run: python scripts/generate_site.py

      - name: Commit and push docs/ if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "sitio: regenera docs/ automáticamente"
          git push
